const DB='obrat-db', STORE='state'; let KEY='app', db, supabaseClient=null, currentUser=null, data={items:[],sales:[],expenses:[],activities:[],categories:['Doprava','Balení','Poplatky','Opravy','Ostatní'],itemCategories:[]}, page='Přehled', period='30', query='', filters={status:'',tag:'',itemCategory:''};

function showAuth(message=''){const root=document.getElementById('authroot'),shell=document.getElementById('appShell');shell.classList.add('hidden');root.classList.remove('hidden');const cfg=window.OBRAT_SUPABASE_CONFIG||{};const configured=cfg.url&&cfg.publishableKey&&!String(cfg.url).includes('PASTE_')&&!String(cfg.publishableKey).includes('PASTE_');root.innerHTML='<div class="authpage"><div class="authcard"><div class="brand" style="padding:0 0 24px"><div class="brandmark">↗</div><div>Profit tracker<small>osobní evidence přeprodeje</small></div></div><h1>Přihlášení do Profit trackeru</h1>'+(configured?'<p>Přihlaste se odkazem, který vám pošleme na e-mail.</p><form id="loginForm"><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="vas@email.cz"></div><button class="btn primary" id="loginButton" type="submit">Poslat přihlašovací odkaz</button></form>':'<p>Supabase zatím není propojený. Doplňte URL projektu a veřejný publishable key do souboru <strong>supabase-config.js</strong> a znovu nasaďte aplikaci.</p>')+'<div class="authstatus" id="authstatus">'+esc(message)+'</div><p style="margin-top:22px;font-size:11px">Inventář, prodeje a výdaje se po přihlášení synchronizují s vaším soukromým účtem.</p></div></div>';const form=document.getElementById('loginForm');if(form)form.onsubmit=async e=>{e.preventDefault();const button=document.getElementById('loginButton'),status=document.getElementById('authstatus');button.disabled=true;status.textContent='Odesílám přihlašovací odkaz…';const {error}=await supabaseClient.auth.signInWithOtp({email:document.getElementById('loginEmail').value.trim(),options:{emailRedirectTo:location.origin}});button.disabled=false;status.textContent=error?'Odkaz se nepodařilo odeslat: '+error.message:'Odkaz jsme odeslali. Otevřete e-mail na tomto zařízení a klikněte na něj.'}}
function emptyData(){return {items:[],sales:[],expenses:[],activities:[],categories:['Doprava','Balení','Poplatky','Opravy','Ostatní'],itemCategories:[]}}
function normalizeData(value){const base=emptyData(),items=Array.isArray(value?.items)?value.items:[];return {...base,...value,items,sales:Array.isArray(value?.sales)?value.sales:[],expenses:Array.isArray(value?.expenses)?value.expenses:[],activities:Array.isArray(value?.activities)?value.activities:[],categories:Array.isArray(value?.categories)?value.categories:base.categories,itemCategories:Array.isArray(value?.itemCategories)?value.itemCategories:[...new Set(items.map(x=>x.category).filter(Boolean))]}}
async function startApp(){try{db=await openDB();const cfg=window.OBRAT_SUPABASE_CONFIG||{};if(!cfg.url||!cfg.publishableKey||String(cfg.url).includes('PASTE_')||String(cfg.publishableKey).includes('PASTE_')){showAuth();return}if(!window.supabase?.createClient){showAuth('Nepodařilo se načíst přihlašovací službu. Obnovte stránku a zkuste to znovu.');return}supabaseClient=window.supabase.createClient(cfg.url,cfg.publishableKey);const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;if(!sessionData.session){showAuth();return}currentUser=sessionData.session.user;const legacy=await getSaved();KEY='app:'+currentUser.id;const cached=await getSaved();const {data:cloud,error}=await supabaseClient.from('app_state').select('state').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;if(cloud?.state){data=normalizeData(cloud.state);await new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(data,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error)})}else{const candidate=cached||legacy;data=candidate?normalizeData(candidate):emptyData();if(candidate&&(data.items.length||data.sales.length||data.expenses.length)){if(!confirm('Našli jsme data uložená v tomto prohlížeči. Nahrát je do vašeho účtu Supabase?'))data=emptyData()}else data=emptyData();await save()}render();supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session){currentUser=null;data=emptyData();showAuth()}})}catch(error){showAuth('Připojení se nepodařilo: '+(error?.message||'zkontrolujte nastavení Supabase a zkuste to znovu.'))}}function render(){document.getElementById("appShell").classList.remove("hidden");document.getElementById("authroot").classList.add("hidden");nav();const root=document.getElementById('content');root.innerHTML=page==='Přehled'?dashboard():page==='Inventář'?inventory():page==='Prodané'?soldPage():page==='Výdaje'?expensesPage():settingsPage();bind()}
function getPeriod(){let from=new Date();from.setDate(from.getDate()-Number(period));return from.toISOString().slice(0,10)}
function dashboard(){let from=getPeriod(), sales=data.sales.filter(x=>x.date>=from), expenses=data.expenses.filter(x=>x.date>=from), revenue=sales.reduce((a,x)=>a+x.price*x.qty,0), gross=sales.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0), cost=sales.reduce((a,x)=>a+x.cost*x.qty,0), exp=expenses.reduce((a,x)=>a+x.amount,0), stock=data.items.reduce((a,x)=>a+x.cost*x.qty,0);const acts=data.activities.slice(0,5);let max=Math.max(1,...sales.map(x=>x.price*x.qty));let bars=sales.slice(0,7).reverse();let chart=bars.length?`<svg viewBox="0 0 600 190" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7da58a" stop-opacity=".22"/><stop offset="1" stop-color="#7da58a" stop-opacity="0"/></linearGradient></defs><path d="${bars.map((x,i)=>`${i?'L':'M'} ${i*600/Math.max(1,bars.length-1)} ${175-(x.price*x.qty/max)*140}`).join(' ')} L 600 190 L 0 190 Z" fill="url(#fill)"/><path d="${bars.map((x,i)=>`${i?'L':'M'} ${i*600/Math.max(1,bars.length-1)} ${175-(x.price*x.qty/max)*140}`).join(' ')}" fill="none" stroke="#47745c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`:`<div class="chart-empty">Po uskutečnění prvního prodeje se zde zobrazí tržby.</div>`;return `<div class="pagehead"><div><div class="eyebrow">Vaše podnikání v malém</div><h1>Přehled</h1><p>Jak se vašemu přeprodeji daří.</p></div><div class="filters"><select class="select" id="period"><option value="30" ${period==='30'?'selected':''}>Posledních 30 dní</option><option value="7" ${period==='7'?'selected':''}>Posledních 7 dní</option><option value="90" ${period==='90'?'selected':''}>Posledních 90 dní</option><option value="365" ${period==='365'?'selected':''}>Posledních 12 měsíců</option><option value="99999" ${period==='99999'?'selected':''}>Celé období</option></select></div></div><div class="grid stats"><div class="card stat"><div class="statlabel">Tržby <span class="stat-icon">↗</span></div><div class="statvalue">${money(revenue)}</div><div class="statfoot">Z uskutečněných prodejů</div></div><div class="card stat"><div class="statlabel">Nákupní náklady <span class="stat-icon">◈</span></div><div class="statvalue">${money(cost)}</div><div class="statfoot">Náklady na prodané kusy</div></div><div class="card stat positive"><div class="statlabel">Hrubý zisk <span class="stat-icon">⌁</span></div><div class="statvalue">${money(gross)}</div><div class="statfoot">${money(gross-exp)} po odečtení výdajů</div></div><div class="card stat"><div class="statlabel">Hodnota inventáře <span class="stat-icon">▣</span></div><div class="statvalue">${money(stock)}</div><div class="statfoot">${data.items.reduce((a,x)=>a+x.qty,0)} kusů v inventáři</div></div></div><div class="grid dashrow"><div class="card panel"><div class="panelhead"><div><h2>Vývoj tržeb</h2><span style="display:block;margin-top:4px">Přehled za zvolené období</span></div><div class="chart-legend"><span><i class="dot"></i>Tržby</span></div></div><div class="chartbox">${chart}</div><div class="chartlabels"><span>${date(from)}</span><span>Dnes</span></div></div><div class="card panel"><div class="panelhead"><h2>Poslední aktivity</h2><span>${acts.length} posledních</span></div><div class="activity">${acts.length?acts.map(a=>`<div class="activity-item"><div class="acticon">${a.kind==='sale'?'↗':a.kind==='expense'?'↘':'▣'}</div><div><div class="acttitle">${esc(a.title)}</div><div class="actsub">${esc(a.sub)} · ${date(a.date)}</div></div><div class="actamount" style="${a.kind==='sale'?'color:var(--green)':''}">${a.amount?money(a.amount):''}</div></div>`).join(''):'<div class="empty">Zatím tu nejsou žádné aktivity.</div>'}</div></div></div><div class="card tablepanel"><div class="tabletop"><h2>Naposledy přidané do inventáře</h2><button class="btn sm" data-action="page-inventory">Zobrazit vše →</button></div>${smallStock()}</div>`}
function smallStock(){let rows=[...data.items].sort((a,b)=>b.created-a.created).slice(0,4);return rows.length?`<div class="tablewrap"><table><thead><tr><th>POLOŽKA</th><th>ŠTÍTEK</th><th>NÁKUPNÍ CENA</th><th>KS</th><th>STAV</th></tr></thead><tbody>${rows.map(x=>`<tr><td><div class="itemcell">${imageHTML(x)}<span>${esc(x.name)}</span></div></td><td>${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'—'}</td><td>${money(x.cost)}</td><td>${x.qty}</td><td><span class="badge">Na skladě</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Inventář je zatím prázdný. Přidejte první položku.</div>'}
function inventory(){
 const allTags=[...new Set(data.items.flatMap(x=>Array.isArray(x.tags)?x.tags:[]))].sort((a,b)=>a.localeCompare(b,'cs'));
 const allCategories=[...new Set([...(data.itemCategories||[]),...data.items.map(x=>x.category).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'cs'));
 const rows=data.items.filter(x=>(!query||(`${x.name} ${x.tags.join(' ')} ${x.category||''} ${x.note}`).toLowerCase().includes(query.toLowerCase()))&&(!filters.tag||x.tags.includes(filters.tag))&&(!filters.itemCategory||(x.category||'')===filters.itemCategory)&&(!filters.status||(x.status||'Aktivní')===filters.status));
 const body=rows.map(x=>{let tags=x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'—';let note=x.note?`<div style="color:var(--muted);font-size:10px;margin-top:3px">${esc(x.note)}</div>`:'';let badge=(x.status||'Aktivní')==='Aktivní'?'badge':'tag';return `<tr><td><div class="itemcell">${imageHTML(x)}<div>${esc(x.name)}${note}</div></div></td><td>${esc(x.category||'—')}</td><td>${tags}</td><td>${money(x.cost)}</td><td>${x.qty}</td><td>${date(x.buyDate)}</td><td><span class="${badge}">${esc(x.status||'Aktivní')}</span></td><td><button class="btn sm primary" data-action="sell" data-id="${x.id}">Prodat</button> <button class="btn sm" data-action="edit-item" data-id="${x.id}">Upravit</button> <button class="btn sm danger" data-action="delete-item" data-id="${x.id}">×</button></td></tr>`}).join('');
 const tagOptions=allTags.map(t=>`<option value="${esc(t)}" ${filters.tag===t?'selected':''}>${esc(t)}</option>`).join('');
 const categoryOptions=allCategories.map(c=>`<option value="${esc(c)}" ${filters.itemCategory===c?'selected':''}>${esc(c)}</option>`).join('');
 return `<div class="pagehead"><div><div class="eyebrow">Vaše zboží</div><h1>Inventář</h1><p>Spravujte položky, které čekají na svého nového majitele.</p></div><button class="btn primary" data-action="add-item">＋ Přidat položku</button></div><div class="toolbar"><div class="toolleft inventory-toolleft"><input class="search" id="search" value="${esc(query)}" placeholder="⌕  Hledat v inventáři…"><div class="inventory-filters"><select class="select" id="tagfilter"><option value="">Všechny tagy</option>${tagOptions}</select><select class="select" id="itemcategoryfilter"><option value="">Všechny kategorie</option>${categoryOptions}</select><select class="select" id="statusfilter"><option value="">Všechny stavy</option><option ${filters.status==='Aktivní'?'selected':''}>Aktivní</option><option ${filters.status==='Pozastaveno'?'selected':''}>Pozastaveno</option></select></div></div><div class="toolright"><span style="font-size:11px;color:var(--muted)">${rows.reduce((a,x)=>a+x.qty,0)} kusů · ${rows.length} položek</span></div></div><div class="card tablepanel">${rows.length?`<div class="tablewrap"><table><thead><tr><th>POLOŽKA</th><th>KATEGORIE</th><th>TAGY</th><th>NÁKUPNÍ CENA</th><th>KS</th><th>DATUM NÁKUPU</th><th>STAV</th><th>AKCE</th></tr></thead><tbody>${body}</tbody></table></div>`:`<div class="empty">${query?'Žádné položky neodpovídají hledání.':'Inventář je zatím prázdný. Přidejte první položku.'}</div>`}</div>`
}function soldPage(){let rows=[...data.sales].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="pagehead"><div><div class="eyebrow">Dokončené obchody</div><h1>Prodané</h1><p>Historie prodejů, tržeb a dosaženého zisku.</p></div><div class="card" style="padding:11px 15px;font-size:11px;color:var(--muted)">Celkem tržby <strong style="color:var(--green);margin-left:7px">${money(rows.reduce((a,x)=>a+x.price*x.qty,0))}</strong></div></div><div class="toolbar"><div class="toolleft"><input class="search" id="search" value="${esc(query)}" placeholder="⌕  Hledat v prodejích…"></div><span style="font-size:11px;color:var(--muted)">${rows.length} prodejů</span></div><div class="card tablepanel sold-table">${rows.length?`<div class="tablewrap"><table><thead><tr><th>POLOŽKA</th><th>DATUM PRODEJE</th><th>KS</th><th>PRODEJNÍ CENA / KS</th><th>TRŽBA</th><th>HRUBÝ ZISK</th></tr></thead><tbody>${rows.filter(x=>!query||x.name.toLowerCase().includes(query.toLowerCase())).map(x=>`<tr><td><div class="itemcell">${imageHTML(x)}${esc(x.name)}</div></td><td>${date(x.date)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.price*x.qty)}</td><td style="color:var(--green);font-weight:700">${money((x.price-x.cost)*x.qty)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Zatím nemáte žádné prodeje. Prodej vytvoříte přímo v inventáři.</div>'}</div>`}
function expensesPage(){let rows=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="pagehead"><div><div class="eyebrow">Náklady podnikání</div><h1>Výdaje</h1><p>Evidujte náklady spojené s vaším přeprodejem.</p></div><button class="btn primary" data-action="add-expense">＋ Přidat výdaj</button></div><div class="toolbar"><div class="toolleft"><input class="search" id="search" value="${esc(query)}" placeholder="⌕  Hledat ve výdajích…"><select class="select" id="categoryfilter"><option value="">Všechny kategorie</option>${data.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><span style="font-size:11px;color:var(--muted)">Celkem ${money(data.expenses.reduce((a,x)=>a+x.amount,0))}</span></div><div class="card tablepanel">${rows.length?`<div class="tablewrap"><table><thead><tr><th>VÝDAJ</th><th>KATEGORIE</th><th>DATUM</th><th>ČÁSTKA</th><th>POZNÁMKA</th><th></th></tr></thead><tbody>${rows.filter(x=>(!query||`${x.name} ${x.note}`.toLowerCase().includes(query.toLowerCase()))&&(!filters.category||x.category===filters.category)).map(x=>`<tr><td><div class="itemcell">${x.image?`<img class="thumb" src="${x.image}">`:'<div class="thumb">↘</div>'}${esc(x.name)}</div></td><td><span class="tag">${esc(x.category)}</span></td><td>${date(x.date)}</td><td style="font-weight:700">${money(x.amount)}</td><td>${esc(x.note)||'—'}</td><td><button class="btn sm danger" data-action="delete-expense" data-id="${x.id}">Smazat</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Zatím nemáte evidované výdaje.</div>'}</div>`}
function settingsPage(){return `<div class="pagehead"><div><div class="eyebrow">Vaše data, vaše pravidla</div><h1>Záloha a nastavení</h1><p>Spravujte data synchronizovaná s vaším účtem.</p></div></div><div class="grid settingsgrid"><div class="card settingcard"><h2>Přihlášený účet</h2><p>${esc(currentUser?.email||"")}</p><div class="settingactions"><button class="btn" data-action="logout">Odhlásit se</button></div></div><div class="card settingcard"><h2>Kompletní záloha</h2><p>Exportujte všechna data včetně fotek do jednoho JSON souboru. Zálohu můžete kdykoli obnovit.</p><div class="settingactions"><button class="btn primary" data-action="backup">↓ Stáhnout zálohu</button><button class="btn" data-action="restore">↑ Obnovit ze souboru</button><input type="file" accept="application/json,.json" id="restorefile" class="hidden"></div></div><div class="card settingcard"><h2>Tabulková data</h2><p>Stáhněte seznamy pro další práci v Excelu nebo jiném tabulkovém editoru.</p><div class="settingactions"><button class="btn" data-action="csv">↓ Exportovat CSV</button></div></div><div class="card settingcard"><h2>Vlastní kategorie výdajů</h2><p>Přidejte kategorii, která se vám bude hodit ve výdajích.</p><div class="settingactions"><input class="search" id="newcat" placeholder="Název kategorie…" style="width:190px"><button class="btn" data-action="add-category">＋ Přidat</button></div><div style="margin-top:15px;display:flex;gap:6px;flex-wrap:wrap">${data.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div></div><div class="card settingcard"><h2>Smazat všechna data</h2><p>Trvale odstraní všechny inventární položky, prodeje a výdaje uložené v tomto prohlížeči.</p><div class="settingactions"><button class="btn danger" data-action="clear">Smazat všechna data</button></div></div></div><div class="notice">🔒 Data se synchronizují s vaším účtem Supabase. Pravidelně si stahujte JSON zálohu i pro případ, že potřebujete kopii mimo web.</div>`}
function bind(){const s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;let p=s.selectionStart;render();let n=document.getElementById('search');n.focus();n.setSelectionRange(p,p)};const tf=document.getElementById('tagfilter');if(tf)tf.onchange=()=>{filters.tag=tf.value;render()};const icf=document.getElementById('itemcategoryfilter');if(icf)icf.onchange=()=>{filters.itemCategory=icf.value;render()};const sf=document.getElementById('statusfilter');if(sf)sf.onchange=()=>{filters.status=sf.value;render()};const cf=document.getElementById('categoryfilter');if(cf)cf.onchange=()=>{filters.category=cf.value;render()};const per=document.getElementById('period');if(per)per.onchange=()=>{period=per.value;render()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id))}async function action(a,id){if(a==='logout'){await supabaseClient.auth.signOut();currentUser=null;data=emptyData();showAuth();return}if(a==='add-item'||a==='edit-item')return itemModal(id);if(a==='sell')return sellModal(id);if(a==='add-expense')return expenseModal();if(a==='page-inventory'){page='Inventář';return render()}if(a==='delete-item'){const x=data.items.find(x=>x.id===id);if(confirm(`Opravdu smazat položku „${x.name}“?`)){data.items=data.items.filter(x=>x.id!==id);activity('item','Smazaná položka',x.name);await save();render()}}if(a==='delete-expense'){let x=data.expenses.find(x=>x.id===id);if(confirm(`Opravdu smazat výdaj „${x.name}“?`)){data.expenses=data.expenses.filter(e=>e.id!==id);activity('expense','Smazaný výdaj',x.name);await save();render()}}if(a==='backup')backup();if(a==='restore')document.getElementById('restorefile').click();if(a==='csv')csv();if(a==='clear'&&confirm('Opravdu smazat všechna data? Tuto akci nelze vrátit.')){data={items:[],sales:[],expenses:[],activities:[],categories:['Doprava','Balení','Poplatky','Opravy','Ostatní'],itemCategories:[]};await save();toast('Všechna data byla smazána.');render()}if(a==='add-category'){let v=document.getElementById('newcat').value.trim();if(v&&!data.categories.includes(v)){data.categories.push(v);await save();render();toast('Kategorie byla přidána.')}}}
function showModal(title,html,submit){document.getElementById('modalroot').innerHTML=`<div class="modalback" id="back"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" id="close">×</button></div><form id="form"><div class="formgrid">${html}</div><div class="modalfooter"><button type="button" class="btn" id="cancel">Zrušit</button><button class="btn primary" type="submit">Uložit</button></div></form></div></div>`;document.getElementById('close').onclick=document.getElementById('cancel').onclick=()=>document.getElementById('modalroot').innerHTML='';document.getElementById('back').onclick=e=>{if(e.target.id==='back')document.getElementById('modalroot').innerHTML=''};document.getElementById('form').onsubmit=async e=>{e.preventDefault();await submit(new FormData(e.target));}}
async function fileData(file){if(!file||!file.size)return '';const bitmap=await createImageBitmap(file),scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.78));if(!blob)throw new Error('Fotku se nepodařilo zpracovat.');return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(blob)})}
function itemModal(id){
 const x=id?data.items.find(x=>x.id===id):{};
 const selectedTags=new Set(Array.isArray(x.tags)?x.tags:[]),pendingCategories=new Set();
 let selectedCategory=x.category||'';
 const usedTags=()=>[...new Set([...data.items.flatMap(i=>Array.isArray(i.tags)?i.tags:[]),...selectedTags])].sort((a,b)=>a.localeCompare(b,'cs'));
 const knownCategories=()=>[...new Set([...(data.itemCategories||[]),...data.items.map(i=>i.category).filter(Boolean),...pendingCategories])].sort((a,b)=>a.localeCompare(b,'cs'));
 const form=`<div class="field full"><label>Název položky *</label><input name="name" required value="${esc(x.name||'')}" placeholder="Například Vintage džínová bunda"></div><div class="field"><label>Nákupní cena za kus (Kč) *</label><input name="cost" type="number" min="0" step="0.01" required value="${x.cost??''}"></div><div class="field"><label>Počet kusů *</label><input name="qty" type="number" min="1" step="1" required value="${x.qty??1}"></div><div class="field"><label>Datum nákupu</label><input name="buyDate" type="date" value="${x.buyDate||today()}"></div><div class="field"><label>Stav položky</label><select name="status"><option ${!x.status||x.status==='Aktivní'?'selected':''}>Aktivní</option><option ${x.status==='Pozastaveno'?'selected':''}>Pozastaveno</option></select></div><div class="field full"><label>Tagy</label><div id="itemTagChoices" class="chip-picker"></div><div class="chip-add"><input id="newItemTag" type="text" placeholder="Název nového tagu"><button class="btn" type="button" id="addItemTag">＋ Přidat tag</button></div><div class="chip-hint">Kliknutím vyberete nebo odeberete používaný tag.</div></div><div class="field full"><label>Kategorie</label><div id="itemCategoryChoices" class="chip-picker"></div><div class="chip-add"><input id="newItemCategory" type="text" placeholder="Název nové kategorie"><button class="btn" type="button" id="addItemCategory">＋ Přidat kategorii</button></div></div><div class="field full"><label>Poznámka</label><textarea name="note" placeholder="Velikost, stav, zdroj…">${esc(x.note||'')}</textarea></div><div class="field full"><label>Fotka položky</label><input name="image" type="file" accept="image/*"></div>`;
 showModal(id?'Upravit položku':'Přidat do inventáře',form,async f=>{
  let image=await fileData(f.get('image'));if(!image)image=x.image||'';
  data.itemCategories=[...new Set([...knownCategories(),...(selectedCategory?[selectedCategory]:[])])];
  const item={id:x.id||crypto.randomUUID(),name:f.get('name').trim(),cost:+f.get('cost'),qty:+f.get('qty'),buyDate:f.get('buyDate')||today(),status:f.get('status')||'Aktivní',tags:[...selectedTags],category:selectedCategory,note:f.get('note').trim(),image,created:x.created||Date.now()};
  if(x.id){data.items=data.items.map(z=>z.id===x.id?item:z);activity('item','Upravená položka',item.name)}else{data.items.unshift(item);activity('item','Přidáno do inventáře',item.name)}
  await save();document.getElementById('modalroot').innerHTML='';render();toast(x.id?'Položka byla upravena.':'Položka byla přidána do inventáře.')
 });
 const tagRoot=document.getElementById('itemTagChoices'),categoryRoot=document.getElementById('itemCategoryChoices');
 const renderTags=()=>{tagRoot.innerHTML=usedTags().map(t=>`<button type="button" class="chip ${selectedTags.has(t)?'selected':''}" data-tag-value="${esc(t)}" aria-pressed="${selectedTags.has(t)}">${esc(t)}</button>`).join('')||'<span class="chip-hint">Zatím nejsou žádné uložené tagy.</span>'};
 const renderCategories=()=>{categoryRoot.innerHTML=`<button type="button" class="chip ${selectedCategory?'':'selected'}" data-category-value="" aria-pressed="${selectedCategory?'false':'true'}">Bez kategorie</button>`+knownCategories().map(c=>`<button type="button" class="chip ${selectedCategory===c?'selected':''}" data-category-value="${esc(c)}" aria-pressed="${selectedCategory===c}">${esc(c)}</button>`).join('')};
 tagRoot.onclick=e=>{const b=e.target.closest('[data-tag-value]');if(!b)return;const tag=b.dataset.tagValue;if(selectedTags.has(tag))selectedTags.delete(tag);else selectedTags.add(tag);renderTags()};
 categoryRoot.onclick=e=>{const b=e.target.closest('[data-category-value]');if(!b)return;selectedCategory=b.dataset.categoryValue;renderCategories()};
 const tagInput=document.getElementById('newItemTag'),categoryInput=document.getElementById('newItemCategory');
 const addTag=()=>{let value=tagInput.value.trim();if(!value)return;const prior=usedTags().find(t=>t.toLocaleLowerCase('cs')===value.toLocaleLowerCase('cs'));selectedTags.add(prior||value);tagInput.value='';renderTags();tagInput.focus()};
 const addCategory=()=>{let value=categoryInput.value.trim();if(!value)return;const prior=knownCategories().find(c=>c.toLocaleLowerCase('cs')===value.toLocaleLowerCase('cs'));selectedCategory=prior||value;if(!prior)pendingCategories.add(value);categoryInput.value='';renderCategories();categoryInput.focus()};
 document.getElementById('addItemTag').onclick=addTag;tagInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTag()}};
 document.getElementById('addItemCategory').onclick=addCategory;categoryInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addCategory()}};
 renderTags();renderCategories()
}function sellModal(id){let x=data.items.find(x=>x.id===id);showModal('Zaznamenat prodej',`<div class="field full"><label>Položka</label><input value="${esc(x.name)}" disabled></div><div class="field"><label>Prodejní cena za kus (Kč) *</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Počet prodaných kusů (max. ${x.qty}) *</label><input name="qty" type="number" min="1" max="${x.qty}" step="1" value="1" required></div><div class="field"><label>Datum prodeje</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Nákupní cena za kus</label><input value="${money(x.cost)}" disabled></div>`,async f=>{let qty=+f.get('qty'),price=+f.get('price');if(qty>x.qty){toast('Počet kusů převyšuje dostupné množství v inventáři.');return}data.sales.unshift({id:crypto.randomUUID(),itemId:x.id,name:x.name,image:x.image||'',emoji:x.emoji||'📦',qty,price,cost:x.cost,date:f.get('date')||today()});x.qty-=qty;if(!x.qty)data.items=data.items.filter(i=>i.id!==x.id);activity('sale','Prodáno: '+x.name,`${qty} ks`,price*qty);await save();document.getElementById('modalroot').innerHTML='';render();toast(`Prodej uložen. Zisk ${money((price-x.cost)*qty)}.`)})}
function expenseModal(){showModal('Přidat výdaj',`<div class="field full"><label>Název výdaje *</label><input name="name" required placeholder="Například Poštovné objednávky"></div><div class="field"><label>Částka (Kč) *</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Kategorie *</label><select name="category">${data.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Datum</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Fotka účtenky</label><input name="image" type="file" accept="image/*"></div><div class="field full"><label>Poznámka</label><textarea name="note" placeholder="Nepovinné doplnění…"></textarea></div>`,async f=>{let expense={id:crypto.randomUUID(),name:f.get('name').trim(),amount:+f.get('amount'),category:f.get('category'),date:f.get('date')||today(),note:f.get('note').trim(),image:await fileData(f.get('image'))};data.expenses.unshift(expense);activity('expense','Nový výdaj',expense.name,-expense.amount);await save();document.getElementById('modalroot').innerHTML='';render();toast('Výdaj byl uložen.')})}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){const b={app:'obrat',version:1,exportedAt:new Date().toISOString(),...data};download(new Blob([JSON.stringify(b,null,2)],{type:'application/json'}),`profit-tracker-zaloha-${today()}.json`);toast('Záloha včetně fotek byla stažena.')}
document.addEventListener('change',async e=>{if(e.target.id==='restorefile'){let file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='obrat'||!Array.isArray(obj.items)||!Array.isArray(obj.sales)||!Array.isArray(obj.expenses))throw Error('Neplatný formát');if(!confirm('Obnovit tuto zálohu? Aktuální data budou nahrazena.')){e.target.value='';return}data={items:obj.items,sales:obj.sales,expenses:obj.expenses,activities:Array.isArray(obj.activities)?obj.activities:[],categories:Array.isArray(obj.categories)?obj.categories:['Doprava','Balení','Poplatky','Opravy','Ostatní'],itemCategories:Array.isArray(obj.itemCategories)?obj.itemCategories:[]};await save();toast('Záloha byla obnovena.');render()}catch(err){alert('Soubor není platná záloha aplikace Profit tracker.');}e.target.value=''}});
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function csv(){let lines=[['Typ','Název','Datum','Kategorie / štítky','Množství','Nákupní cena','Prodejní cena','Částka','Zisk','Poznámka']];data.items.forEach(x=>lines.push(['Inventární položka',x.name,x.buyDate,x.tags.join(', '),x.qty,x.cost,'','','',x.note]));data.sales.forEach(x=>lines.push(['Prodej',x.name,x.date,'',x.qty,x.cost,x.price,x.price*x.qty,(x.price-x.cost)*x.qty,'']));data.expenses.forEach(x=>lines.push(['Výdaj',x.name,x.date,x.category,'','','',x.amount,-x.amount,x.note]));download(new Blob(['\ufeff'+lines.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`profit-tracker-export-${today()}.csv`);toast('CSV export byl stažen.')}
let toastTimer;function toast(msg){const e=document.getElementById('toastroot');e.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.innerHTML='',3000)}
startApp();
</script></body></html>
